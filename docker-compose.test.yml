services:
  mysql:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: integration-root
      MYSQL_DATABASE: taskservice_test
      MYSQL_USER: test
      MYSQL_PASSWORD: integration-test
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
  tests:
    image: golang:1.26.8
    working_dir: /src
    volumes:
      - .:/src:ro
      - go_modules:/go/pkg/mod
      - go_build:/root/.cache/go-build
    environment:
      TEST_MYSQL_DSN: test:integration-test@tcp(mysql:3306)/taskservice_test?parseTime=true&loc=UTC
      TEST_REDIS_ADDR: redis:6379
      GOFLAGS: -mod=readonly
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "go test -race -count=1 -v ./... && go vet ./..."]
volumes:
  go_modules:
  go_build:
